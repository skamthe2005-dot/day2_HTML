<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .request_now {
            background-color: black;
            color: white;
            height: 40px;
            width: 100px;
            border: none;
            border-radius: 2px;
            opacity: 1;
            

        }
        .add_to_cart{
            background-color: rgb(255,216,20);
            color:black ;
            border-radius: 25%;
            padding-left: 30px ;
            padding-right: 30px;
            padding-bottom: 30px;
            padding-top: 30px;
            
            border: none;
            border-radius: 20px;
        }
        .sign_up {
            background-color: green;
            color: white;
            border-radius: 5%;
            border: none;
            height: 40px;
            width: 100px;
            border-radius: 2px;
        }
        .get_started{
            background-color:rgb(121,82,179) ;
            color: white;
            border: none;
        }
        .download{
            background-color: white;
            color: black;
            border: none;
        }
        .download:hover{
            background-color: aqua;
        }

    </style>
</head>
<body>
    <button class="request_now">request now</button><br><br>
    <button class="add_to_cart">add to cart</button><br><br>
    <button class="sign_up">sign up</button><br><br>
    <button class="get_started">get started</button>
    <button class="download">download</button>
</body>
</html>
